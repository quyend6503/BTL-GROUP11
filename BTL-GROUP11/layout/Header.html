<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-size: 20px;
      font-weight: 10000px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .header {
      top: 0;
      justify-content: space-between;
      padding: 0 20px;
      box-sizing: border-box;
      background: #000;
      width: 100%;
      height: 80px;
      color: white;
      z-index: 100;
      display: flex;
    }

    .header a {
      color: white;
      text-decoration: none;
    }

    .logo img {
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .nav {
      display: flex;
      gap: 30px;
      flex-grow: 1;
      justify-content: center;
      
    }

    .nav a {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 4px;
    }

    .nav a span {
      position: relative;
      padding: 2px 4px;
      text-decoration: none;
      color: white;
      display: inline-block;
      align-items: center;
      transition: transform 0.2s;
    }

    .nav a span:hover {
      color: #efb022;
      transform: scale(1.1);
    }

    .nav a span::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -6px;
      height: 2px;
      width: 0;
      background-color: #efb022;
      transition: width 0.3s;
    }

    .nav a span:hover::after {
      width: 100%;
    }

    .search-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-area input {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #999;
    }

    .lang-btn {
      background: #a67c52;
      color: white;
      border: none;
      padding: 7px 15px;
      border-radius: 6px;
    }


    .hamburger {
      display: none;
      font-size: 28px;
      color: white;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .nav {
        flex-direction: column;
        background: rgb(248, 247, 247);
        padding: 0;
        position: absolute;
        right: -250px;
        width: 30%;
        box-shadow: 0 4px 10px rgba(252, 252, 252, 0.2);
        z-index: 150;
      }

      .nav.active {
        display: flex;
        right: 0;
      }

      .nav a {
        padding: 15px 20px;
        color: black;
        text-decoration: none;
        text-align: left;
        padding: 2px 0;
      }


      .hamburger {
        display: flex;
        font-size: 28px;
        cursor: pointer;
        color: white;
        z-index: 200;
        right: 0;
      }
    }
  </style>
</head>

<body>
  <div id="header">

    <header class="header">
      <div class="logo">
        <img src="../layout/logo.png" alt="Gánh Quán" />
      </div>
      <nav class="nav">
        <a href="#"><span>Trang chủ</span></a>
        <a href="#"><span>Thực đơn</span></a>
        <a href="#"><span>Khuyến mãi</span></a>
        <a href="#"><span>Tin tức</span></a>
        <a href="#"><span>Về chúng tôi</span></a>
      </nav>

      <div class="search-area">
        <input placeholder="Tìm kiếm" />
        <button class="lang-btn">EN</button>
      </div>
      <div class="hamburger" onclick="toggleMenu()">
        &#9776;
      </div>
    </header>
  </div>
</body>
</html>
