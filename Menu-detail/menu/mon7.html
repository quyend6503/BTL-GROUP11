<div class="overlay" id="overlay">

    <div class="menu-popup">
        <button class="close-btn1" onclick="closePopup()">✕</button>

        <div class="menu-header">Chi Tiết Món Ăn</div>

        <div class="menu-content">

            <!-- LEFT -->
            <div class="left-col">
                <div class="dish-name"> Gà trộn
                </div>

                <div class="image-slider">
                    <button class="arrow left" onclick="prevImage()">❮</button>

                    <img id="dishImage" src="../../Menu-detail/images/gatron1.jpeg" alt="Món ăn">

                    <button class="arrow right" onclick="nextImage()">❯</button>
                </div>


                <div class="dish-desc">
Gà trộn là món ăn thanh nhẹ với thịt gà xé mềm, thấm đều gia vị chua ngọt hài hòa. Rau thơm, hành phi và chút lạc rang tạo thêm độ giòn bùi cuốn hút. Khi trộn đều và thưởng thức, món ăn mang lại cảm giác tươi mát, dễ ăn và cực kỳ bắt miệng.
                </div>
            </div>
            <!-- RIGHT -->
            <div class="menu-info">

                <label>Lựa chọn thêm:</label>
                <div>
                    <input type="radio" name="option" value="0"data-name="Không thêm" checked> Không thêm <br>
                    <input type="radio" name="option" value="0"data-name="Thêm rau mùi"> Thêm rau mùi <br>
                </div>

                <label>Ghi chú:</label>
                <textarea id="noteInput" placeholder="Thêm yêu cầu..."></textarea>

                <label>Thành tiền:
                    <span id="totalPrice" style="color:white;">150.000đ</span>
                </label>

                <div class="menu-actions">
                    <button class="btn-add1" onclick="addToCart(
        'Gà trộn',
        currentTotalPrice,
        currentOptionName,
        document.getElementById('noteInput')?.value || '',
        '../../../Menu-detail/images/gatron1.jpeg'
    )">Thêm vào giỏ</button>

                </div>
            </div>

        </div>
    </div>

    <div class="dialogue-popup" id="dialoguePopup">
        <img src="../Menu-detail/images/tusena.jpg" class="dialogue-avatar">
        <div class="dialogue-name">Staff Hiếu</div>
        <div class="dialogue-text" id="dialogueText"></div>
        <div class="dialogue-choices" id="dialogueChoices"></div>
    </div>

</div>
