<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />

  <title>Gánh Quán - Trang Khuyến mãi</title>
  <link rel="icon" type="image/png" href="../../img/LOGO.png">
  <!-- Link file css -->
  <link rel="stylesheet" href="../css/KhuyenMai.css">
  <link rel="stylesheet" href="../../layout/footer.css">
  <link rel="stylesheet" href="../../layout/header.css">
  <script src="/layout/layout.js"></script>
</head>

<body>
  <div id="header"></div>
  
  <section class="page">
    <h1 class="page-title">Khuyến mại dành cho dùng bữa tại nhà hàng</h1>
    <div class="title-line"></div>
    <div id="deal-items"></div>

    <h1 class="page-title">Ưu đãi dành cho giao hàng và nhận hàng</h1>
    <div class="title-line"></div>
    <div id="dealsship"></div>
  </section>

  <section class="Cheer">
    <span class="sparkle-set">
      <span>✧</span>
      <span>✧</span>
      <span>✧</span>
    </span>
    <div class="cheers-text">
      <i> Gánh Quán chúc bạn mùa giáng sinh an lành </i>
    </div>
    <span class="sparkle-set">
      <span>✧</span>
      <span>✧</span>
      <span>✧</span>
      <span>✧</span>
      <span>✧</span>
    </span>

    <div class="cheers-wrap">
      <img src="../../img/ImgKhuyenMai/trai.png" class="glass-png left">
      <img src="../../img/ImgKhuyenMai/phai.png" class="glass-png right">
    </div>

  </section>

  <section class="box">
    <div id="secret-container"></div>
    <div class="promo-container"></div>
  </section>

  <div id="footer"></div>

  <!-- JS riêng -->
  <script type="module" src="../js/KhuyenMai.js" defer></script>

</body>

</html>
