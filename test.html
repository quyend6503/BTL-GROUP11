<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radial Glow Background</title>
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #020617;
      font-family: sans-serif;
    }

    .page-wrapper {
      min-height: 100vh;
      width: 100%;
      background: #020617;
      position: relative;
      overflow: hidden;
    }

    /* Hiệu ứng radial đỏ */
    .radial-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      background-image: radial-gradient(
        circle 500px at 50% 100px,
        rgba(239, 68, 68, 0.4),
        transparent
      );
    }

    /* Nội dung ví dụ */
    .content {
      position: relative;
      z-index: 1;
      color: white;
      text-align: center;
      padding-top: 150px;
      font-size: 32px;
    }
  </style>
</head>

<body>
  <div class="page-wrapper">
    <div class="radial-bg"></div>

    <!-- Content -->
    <div class="content">
      <i class='bx  bxs-fork-knife'></i> 

      Your Content Hẻe
    </div>
  </div>
</body>
</html>
